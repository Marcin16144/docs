<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>05 - Sterowanie oświetleniem</title>
<style>
:root{--bg:#0f172a;--surface:#1e293b;--border:#334155;--text:#e2e8f0;--text-muted:#94a3b8;--accent:#a78bfa;--accent-hover:#c4b5fd;--green:#4ade80;--purple:#a78bfa;--orange:#fb923c;--pink:#f472b6;--code-bg:#0d1117}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.7}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:10}
.topbar a{color:var(--accent);text-decoration:none;font-size:.9rem;font-weight:500}
.topbar a:hover{color:var(--accent-hover)}
.topbar .sep{color:var(--border)}
.topbar .title{color:var(--text-muted);font-size:.9rem}
.container{max-width:900px;margin:0 auto;padding:40px 20px 80px}
h1{font-size:2rem;font-weight:700;margin-bottom:16px;background:linear-gradient(135deg,var(--purple),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
h2{font-size:1.35rem;font-weight:600;color:var(--accent);margin:36px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--border)}
h3{font-size:1.1rem;font-weight:600;color:var(--text);margin:22px 0 10px}
p{margin-bottom:14px}
ul,ol{margin:0 0 16px 24px}
li{margin-bottom:6px}
strong{color:var(--accent-hover)}
em{color:var(--orange)}
a{color:var(--green);text-decoration:none}
a:hover{text-decoration:underline}
table{width:100%;border-collapse:collapse;margin:16px 0 24px;font-size:.9rem}
th{background:var(--surface);color:var(--accent);padding:10px 14px;text-align:left;border:1px solid var(--border);font-weight:600}
td{padding:10px 14px;border:1px solid var(--border)}
pre{background:var(--code-bg);border:1px solid var(--border);border-radius:8px;padding:16px 20px;overflow-x:auto;margin:16px 0 24px;font-size:.85rem;line-height:1.6}
code{font-family:'Cascadia Code','Fira Code','Consolas',monospace;color:var(--green);background:rgba(0,0,0,.3);padding:2px 6px;border-radius:4px;font-size:.88rem}
pre code{background:none;padding:0;color:var(--text-muted)}
blockquote{border-left:3px solid var(--accent);padding:8px 16px;margin:16px 0;background:var(--surface);color:var(--text-muted);border-radius:0 6px 6px 0}
hr{border:none;border-top:1px solid var(--border);margin:32px 0}
</style>
</head>
<body>
<div class="topbar">
<a href="index.html">Spis tresci</a>
<span class="sep">/</span>
<span class="title">05 - Sterowanie oświetleniem</span>
</div>
<div class="container" id="content">Ladowanie...</div>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
fetch('05-oswietlenie.md').then(r=>r.text()).then(t=>{document.getElementById('content').innerHTML=marked.parse(t);});
</script>
</body>
</html>
