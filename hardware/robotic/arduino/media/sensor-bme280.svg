<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 140" role="img" aria-label="BME280">
<rect x="40" y="30" width="100" height="80" rx="3" fill="#0d3b6f" stroke="#082548"/>
<!-- IC BME280 -->
<rect x="76" y="56" width="28" height="28" rx="1" fill="#0a0a0a"/>
<text x="90" y="74" text-anchor="middle" font-size="6" fill="#e2e8f0" font-weight="700">BME</text>
<text x="90" y="80" text-anchor="middle" font-size="5" fill="#e2e8f0">280</text>
<!-- mały kondensator -->
<rect x="56" y="62" width="6" height="10" fill="#c8a060"/>
<rect x="116" y="62" width="6" height="10" fill="#c8a060"/>
<!-- piny -->
<rect x="44" y="100" width="92" height="10" fill="#1a1a1a"/>
<g fill="#c89b2f"><circle cx="52" cy="105" r="1.8"/><circle cx="68" cy="105" r="1.8"/><circle cx="84" cy="105" r="1.8"/><circle cx="100" cy="105" r="1.8"/><circle cx="116" cy="105" r="1.8"/><circle cx="132" cy="105" r="1.8"/></g>
<text x="52" y="122" text-anchor="middle" font-size="5" fill="#cbd5e1">VCC</text>
<text x="68" y="122" text-anchor="middle" font-size="5" fill="#cbd5e1">GND</text>
<text x="84" y="122" text-anchor="middle" font-size="5" fill="#cbd5e1">SCL</text>
<text x="100" y="122" text-anchor="middle" font-size="5" fill="#cbd5e1">SDA</text>
<text x="116" y="122" text-anchor="middle" font-size="5" fill="#cbd5e1">CSB</text>
<text x="132" y="122" text-anchor="middle" font-size="5" fill="#cbd5e1">SDO</text>
<text x="90" y="46" text-anchor="middle" font-size="6" fill="#ffffff" font-weight="700">BME280</text>
<text x="90" y="135" text-anchor="middle" font-size="6" fill="#94a3b8">T + RH + P (I²C)</text>
