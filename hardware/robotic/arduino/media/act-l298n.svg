<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" role="img" aria-label="L298N H-mostek">
<rect x="10" y="14" width="220" height="122" rx="4" fill="#600a0a" stroke="#3a0606"/>
<!-- duzy srebrny radiator -->
<rect x="90" y="30" width="80" height="44" rx="2" fill="#c0c0c0" stroke="#5a5a5a"/>
<g stroke="#5a5a5a" stroke-width="0.6">
<line x1="98" y1="34" x2="98" y2="70"/><line x1="108" y1="34" x2="108" y2="70"/><line x1="118" y1="34" x2="118" y2="70"/><line x1="128" y1="34" x2="128" y2="70"/><line x1="138" y1="34" x2="138" y2="70"/><line x1="148" y1="34" x2="148" y2="70"/><line x1="158" y1="34" x2="158" y2="70"/>
</g>
<text x="130" y="58" text-anchor="middle" font-size="9" fill="#0a0a0a" font-weight="700">L298N</text>
<!-- terminal block motors A -->
<rect x="14" y="36" width="44" height="22" fill="#1a8a1a" stroke="#0a4a0a"/>
<circle cx="24" cy="47" r="3" fill="#5a5a5a"/><circle cx="48" cy="47" r="3" fill="#5a5a5a"/>
<text x="36" y="68" text-anchor="middle" font-size="5" fill="#cbd5e1">MOTOR A</text>
<!-- terminal block VCC/GND -->
<rect x="14" y="82" width="60" height="22" fill="#1a8a1a" stroke="#0a4a0a"/>
<circle cx="24" cy="93" r="3" fill="#5a5a5a"/><circle cx="44" cy="93" r="3" fill="#5a5a5a"/><circle cx="64" cy="93" r="3" fill="#5a5a5a"/>
<text x="44" y="114" text-anchor="middle" font-size="5" fill="#cbd5e1">+12V GND +5V</text>
<!-- terminal block motors B -->
<rect x="182" y="36" width="44" height="22" fill="#1a8a1a" stroke="#0a4a0a"/>
<circle cx="192" cy="47" r="3" fill="#5a5a5a"/><circle cx="216" cy="47" r="3" fill="#5a5a5a"/>
<text x="204" y="68" text-anchor="middle" font-size="5" fill="#cbd5e1">MOTOR B</text>
<!-- header pinow logiki -->
<rect x="100" y="98" width="64" height="14" fill="#1a1a1a"/>
<g fill="#c89b2f"><circle cx="108" cy="105" r="1.5"/><circle cx="118" cy="105" r="1.5"/><circle cx="128" cy="105" r="1.5"/><circle cx="138" cy="105" r="1.5"/><circle cx="148" cy="105" r="1.5"/><circle cx="158" cy="105" r="1.5"/></g>
<text x="132" y="124" text-anchor="middle" font-size="6" fill="#cbd5e1">ENA IN1 IN2 IN3 IN4 ENB</text>
<text x="120" y="142" text-anchor="middle" font-size="9" fill="#ffffff" font-weight="700">L298N — H-mostek 2A</text>
</svg>
