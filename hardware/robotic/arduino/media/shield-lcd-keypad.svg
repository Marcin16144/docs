<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" role="img" aria-label="LCD Keypad Shield">
<rect x="6" y="14" width="228" height="124" rx="6" fill="#0d3b6f" stroke="#082548"/>
<!-- LCD 16x2 góra -->
<rect x="22" y="26" width="196" height="56" rx="3" fill="#0a3a1a" stroke="#062a12"/>
<rect x="28" y="32" width="184" height="44" fill="#4ade80" stroke="#2a7a3a" stroke-width="1"/>
<text x="40" y="50" font-family="Courier New,monospace" font-size="11" fill="#0a3a1a" font-weight="700">MENU GLOWNE</text>
<text x="40" y="68" font-family="Courier New,monospace" font-size="11" fill="#0a3a1a" font-weight="700">&gt; Ustawienia</text>
<!-- 6 przycisków -->
<g>
<rect x="24" y="92" width="22" height="22" rx="3" fill="#1a1a1a" stroke="#5a5a5a"/><circle cx="35" cy="103" r="6" fill="#3a3a3a"/><text x="35" y="128" text-anchor="middle" font-size="6" fill="#ffffff">SELECT</text>
<rect x="52" y="92" width="22" height="22" rx="3" fill="#1a1a1a" stroke="#5a5a5a"/><circle cx="63" cy="103" r="6" fill="#3a3a3a"/><text x="63" y="128" text-anchor="middle" font-size="6" fill="#ffffff">LEFT</text>
<rect x="80" y="92" width="22" height="22" rx="3" fill="#1a1a1a" stroke="#5a5a5a"/><circle cx="91" cy="103" r="6" fill="#3a3a3a"/><text x="91" y="128" text-anchor="middle" font-size="6" fill="#ffffff">UP</text>
<rect x="108" y="92" width="22" height="22" rx="3" fill="#1a1a1a" stroke="#5a5a5a"/><circle cx="119" cy="103" r="6" fill="#3a3a3a"/><text x="119" y="128" text-anchor="middle" font-size="6" fill="#ffffff">DOWN</text>
<rect x="136" y="92" width="22" height="22" rx="3" fill="#1a1a1a" stroke="#5a5a5a"/><circle cx="147" cy="103" r="6" fill="#3a3a3a"/><text x="147" y="128" text-anchor="middle" font-size="6" fill="#ffffff">RIGHT</text>
<rect x="172" y="92" width="22" height="22" rx="3" fill="#1a1a1a" stroke="#5a5a5a"/><circle cx="183" cy="103" r="6" fill="#c0392b"/><text x="183" y="128" text-anchor="middle" font-size="6" fill="#ffffff">RESET</text>
</g>
<text x="220" y="142" text-anchor="end" font-size="8" fill="#ffffff" font-weight="700">LCD Keypad Shield</text>
</svg>
