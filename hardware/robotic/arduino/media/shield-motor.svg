<g fill="#c89b2f"><circle cx="56" cy="19" r="1.3"/><circle cx="66" cy="19" r="1.3"/><circle cx="76" cy="19" r="1.3"/><circle cx="86" cy="19" r="1.3"/><circle cx="96" cy="19" r="1.3"/><circle cx="106" cy="19" r="1.3"/><circle cx="116" cy="19" r="1.3"/><circle cx="126" cy="19" r="1.3"/><circle cx="136" cy="19" r="1.3"/><circle cx="146" cy="19" r="1.3"/><circle cx="156" cy="19" r="1.3"/><circle cx="166" cy="19" r="1.3"/><circle cx="176" cy="19" r="1.3"/><circle cx="186" cy="19" r="1.3"/><circle cx="196" cy="19" r="1.3"/><circle cx="206" cy="19" r="1.3"/><circle cx="216" cy="19" r="1.3"/><circle cx="226" cy="19" r="1.3"/></g>
