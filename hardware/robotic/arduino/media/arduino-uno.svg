<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Arduino Uno R3">
<rect x="6" y="14" width="228" height="132" rx="8" fill="#00697a" stroke="#0a4a55" stroke-width="1.2"/>
<!-- USB-B left -->
<rect x="0" y="32" width="34" height="40" rx="2" fill="#9aa4ad" stroke="#5a6670"/>
<rect x="4" y="38" width="26" height="28" fill="#1a2026"/>
<text x="17" y="56" text-anchor="middle" font-family="Segoe UI" font-size="6" fill="#7a8590">USB-B</text>
<!-- DC jack -->
<rect x="0" y="100" width="32" height="28" rx="2" fill="#1a1a1a" stroke="#5a6670"/>
<circle cx="14" cy="114" r="6" fill="#0a0a0a" stroke="#4a4a4a"/>
<circle cx="14" cy="114" r="2" fill="#c89b2f"/>
<!-- ATmega328P DIP-28 -->
<rect x="120" y="58" width="80" height="48" rx="2" fill="#0a0a0a"/>
<text x="160" y="78" text-anchor="middle" font-family="Segoe UI" font-size="8" fill="#e2e8f0" font-weight="700">ATmega328P</text>
<text x="160" y="92" text-anchor="middle" font-family="Segoe UI" font-size="6" fill="#94a3b8">DIP-28</text>
<!-- pin holes in IC -->
<g fill="#4a4a4a"><circle cx="126" cy="64" r="1"/><circle cx="126" cy="100" r="1"/><circle cx="194" cy="64" r="1"/><circle cx="194" cy="100" r="1"/></g>
<!-- Top pin headers (digital) -->
<rect x="48" y="14" width="184" height="14" fill="#1a1a1a"/>
<g fill="#c89b2f"><circle cx="55" cy="21" r="1.5"/><circle cx="65" cy="21" r="1.5"/><circle cx="75" cy="21" r="1.5"/><circle cx="85" cy="21" r="1.5"/><circle cx="95" cy="21" r="1.5"/><circle cx="105" cy="21" r="1.5"/><circle cx="115" cy="21" r="1.5"/><circle cx="125" cy="21" r="1.5"/><circle cx="135" cy="21" r="1.5"/><circle cx="145" cy="21" r="1.5"/><circle cx="155" cy="21" r="1.5"/><circle cx="165" cy="21" r="1.5"/><circle cx="175" cy="21" r="1.5"/><circle cx="185" cy="21" r="1.5"/><circle cx="195" cy="21" r="1.5"/><circle cx="205" cy="21" r="1.5"/><circle cx="215" cy="21" r="1.5"/><circle cx="225" cy="21" r="1.5"/></g>
<text x="140" y="10" text-anchor="middle" font-family="Segoe UI" font-size="6" fill="#94a3b8">DIGITAL 0-13</text>
<!-- Bottom pin headers (power + analog) -->
<rect x="36" y="132" width="100" height="14" fill="#1a1a1a"/>
<rect x="146" y="132" width="80" height="14" fill="#1a1a1a"/>
<g fill="#c89b2f"><circle cx="44" cy="139" r="1.5"/><circle cx="54" cy="139" r="1.5"/><circle cx="64" cy="139" r="1.5"/><circle cx="74" cy="139" r="1.5"/><circle cx="84" cy="139" r="1.5"/><circle cx="94" cy="139" r="1.5"/><circle cx="104" cy="139" r="1.5"/><circle cx="114" cy="139" r="1.5"/><circle cx="124" cy="139" r="1.5"/></g>
<g fill="#c89b2f"><circle cx="154" cy="139" r="1.5"/><circle cx="164" cy="139" r="1.5"/><circle cx="174" cy="139" r="1.5"/><circle cx="184" cy="139" r="1.5"/><circle cx="194" cy="139" r="1.5"/><circle cx="204" cy="139" r="1.5"/></g>
<text x="85" y="155" text-anchor="middle" font-family="Segoe UI" font-size="6" fill="#94a3b8">POWER</text>
<text x="180" y="155" text-anchor="middle" font-family="Segoe UI" font-size="6" fill="#94a3b8">ANALOG A0-A5</text>
<!-- Reset button -->
<rect x="40" y="40" width="14" height="14" rx="2" fill="#3a3a3a" stroke="#7a7a7a"/>
<circle cx="47" cy="47" r="3" fill="#c0392b"/>
<!-- LEDs (PWR, L, TX, RX) -->
<circle cx="48" cy="76" r="2.5" fill="#4ade80"/><text x="48" y="90" text-anchor="middle" font-size="4" fill="#94a3b8">PWR</text>
<circle cx="62" cy="76" r="2.5" fill="#fbbf24"/><text x="62" y="90" text-anchor="middle" font-size="4" fill="#94a3b8">L</text>
<circle cx="76" cy="76" r="2.5" fill="#fb923c"/><circle cx="86" cy="76" r="2.5" fill="#fb923c"/><text x="81" y="90" text-anchor="middle" font-size="4" fill="#94a3b8">TX RX</text>
<!-- Quartz -->
<rect x="100" y="46" width="14" height="6" rx="1" fill="#c0c0c0"/>
<!-- ICSP -->
<rect x="208" y="58" width="14" height="20" fill="#1a1a1a"/>
<g fill="#c89b2f"><circle cx="212" cy="63" r="1"/><circle cx="218" cy="63" r="1"/><circle cx="212" cy="68" r="1"/><circle cx="218" cy="68" r="1"/><circle cx="212" cy="73" r="1"/><circle cx="218" cy="73" r="1"/></g>
<!-- Silkscreen label -->
<text x="80" y="118" font-family="Segoe UI" font-size="12" fill="#ffffff" font-weight="700" font-style="italic">UNO R3</text>
</svg>
