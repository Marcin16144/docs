<circle cx="14" cy="87" r="1.5"/><circle cx="24" cy="87" r="1.5"/><circle cx="34" cy="87" r="1.5"/><circle cx="44" cy="87" r="1.5"/><circle cx="54" cy="87" r="1.5"/><circle cx="64" cy="87" r="1.5"/><circle cx="74" cy="87" r="1.5"/><circle cx="84" cy="87" r="1.5"/><circle cx="94" cy="87" r="1.5"/><circle cx="104" cy="87" r="1.5"/><circle cx="114" cy="87" r="1.5"/><circle cx="124" cy="87" r="1.5"/><circle cx="134" cy="87" r="1.5"/><circle cx="144" cy="87" r="1.5"/><circle cx="154" cy="87" r="1.5"/><circle cx="164" cy="87" r="1.5"/><circle cx="174" cy="87" r="1.5"/><circle cx="184" cy="87" r="1.5"/><circle cx="194" cy="87" r="1.5"/><circle cx="204" cy="87" r="1.5"/>
