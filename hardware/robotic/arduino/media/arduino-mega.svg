<circle cx="14" cy="93" r="6" fill="#0a0a0a" stroke="#4a4a4a"/>
<circle cx="14" cy="93" r="2" fill="#c89b2f"/>
<!-- ATmega2560 TQFP-100 (large square) -->
<rect x="160" y="50" width="64" height="56" rx="1" fill="#0a0a0a"/>
<text x="192" y="76" text-anchor="middle" font-family="Segoe UI" font-size="9" fill="#e2e8f0" font-weight="700">ATmega2560</text>
<text x="192" y="90" text-anchor="middle" font-family="Segoe UI" font-size="6" fill="#94a3b8">TQFP-100</text>
