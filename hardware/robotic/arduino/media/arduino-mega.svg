<rect x="40" y="14" width="252" height="12" fill="#1a1a1a"/>
<g fill="#c89b2f">
<circle cx="48" cy="20" r="1.4"/><circle cx="56" cy="20" r="1.4"/><circle cx="64" cy="20" r="1.4"/><circle cx="72" cy="20" r="1.4"/><circle cx="80" cy="20" r="1.4"/><circle cx="88" cy="20" r="1.4"/><circle cx="96" cy="20" r="1.4"/><circle cx="104" cy="20" r="1.4"/><circle cx="112" cy="20" r="1.4"/><circle cx="120" cy="20" r="1.4"/><circle cx="128" cy="20" r="1.4"/><circle cx="136" cy="20" r="1.4"/><circle cx="144" cy="20" r="1.4"/><circle cx="152" cy="20" r="1.4"/><circle cx="160" cy="20" r="1.4"/><circle cx="168" cy="20" r="1.4"/><circle cx="176" cy="20" r="1.4"/><circle cx="184" cy="20" r="1.4"/><circle cx="192" cy="20" r="1.4"/><circle cx="200" cy="20" r="1.4"/><circle cx="208" cy="20" r="1.4"/><circle cx="216" cy="20" r="1.4"/><circle cx="224" cy="20" r="1.4"/><circle cx="232" cy="20" r="1.4"/><circle cx="240" cy="20" r="1.4"/><circle cx="248" cy="20" r="1.4"/><circle cx="256" cy="20" r="1.4"/><circle cx="264" cy="20" r="1.4"/><circle cx="272" cy="20" r="1.4"/><circle cx="280" cy="20" r="1.4"/>
</g>
<text x="160" y="9" text-anchor="middle" font-family="Segoe UI" font-size="6" fill="#94a3b8">DIGITAL 0-53 (PWM 2-13)</text>
<!-- Bottom headers -->
<rect x="40" y="108" width="252" height="12" fill="#1a1a1a"/>
<g fill="#c89b2f">
<circle cx="48" cy="114" r="1.4"/><circle cx="56" cy="114" r="1.4"/><circle cx="64" cy="114" r="1.4"/><circle cx="72" cy="114" r="1.4"/><circle cx="80" cy="114" r="1.4"/><circle cx="88" cy="114" r="1.4"/><circle cx="96" cy="114" r="1.4"/><circle cx="104" cy="114" r="1.4"/><circle cx="112" cy="114" r="1.4"/><circle cx="120" cy="114" r="1.4"/><circle cx="128" cy="114" r="1.4"/><circle cx="136" cy="114" r="1.4"/><circle cx="144" cy="114" r="1.4"/><circle cx="152" cy="114" r="1.4"/><circle cx="160" cy="114" r="1.4"/><circle cx="168" cy="114" r="1.4"/><circle cx="176" cy="114" r="1.4"/><circle cx="184" cy="114" r="1.4"/><circle cx="192" cy="114" r="1.4"/><circle cx="200" cy="114" r="1.4"/><circle cx="208" cy="114" r="1.4"/><circle cx="216" cy="114" r="1.4"/><circle cx="224" cy="114" r="1.4"/><circle cx="232" cy="114" r="1.4"/><circle cx="240" cy="114" r="1.4"/><circle cx="248" cy="114" r="1.4"/><circle cx="256" cy="114" r="1.4"/><circle cx="264" cy="114" r="1.4"/><circle cx="272" cy="114" r="1.4"/><circle cx="280" cy="114" r="1.4"/>
