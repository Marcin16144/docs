<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 130" role="img" aria-label="Arduino Mega 2560">
<rect x="6" y="14" width="288" height="106" rx="8" fill="#00697a" stroke="#0a4a55"/>
<!-- USB-B left -->
<rect x="0" y="28" width="34" height="36" rx="2" fill="#9aa4ad" stroke="#5a6670"/>
<rect x="4" y="34" width="26" height="24" fill="#1a2026"/>
