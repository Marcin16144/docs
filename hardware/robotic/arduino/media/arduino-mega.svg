<rect x="40" y="34" width="12" height="12" rx="1" fill="#3a3a3a" stroke="#7a7a7a"/>
<circle cx="46" cy="40" r="3" fill="#c0392b"/>
<!-- LEDs -->
<g><circle cx="60" cy="60" r="2" fill="#4ade80"/><circle cx="68" cy="60" r="2" fill="#fbbf24"/><circle cx="76" cy="60" r="2" fill="#fb923c"/><circle cx="84" cy="60" r="2" fill="#fb923c"/></g>
<!-- Quartz -->
<rect x="110" y="46" width="18" height="8" rx="1" fill="#c0c0c0"/>
<!-- ICSP -->
<rect x="232" y="50" width="14" height="20" fill="#1a1a1a"/>
<g fill="#c89b2f"><circle cx="236" cy="55" r="1"/><circle cx="242" cy="55" r="1"/><circle cx="236" cy="60" r="1"/><circle cx="242" cy="60" r="1"/><circle cx="236" cy="65" r="1"/><circle cx="242" cy="65" r="1"/></g>
<!-- label -->
<text x="86" y="96" font-family="Segoe UI" font-size="14" fill="#ffffff" font-weight="700" font-style="italic">MEGA 2560</text>
</svg>
