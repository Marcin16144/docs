<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" role="img" aria-label="OLED 0.96 cala SSD1306">
<rect x="20" y="14" width="160" height="90" rx="3" fill="#0a0a0a" stroke="#3a3a3a"/>
<!-- ekran OLED 128x64 -->
<rect x="30" y="22" width="140" height="60" fill="#1a1a2a" stroke="#3a3a3a"/>
<!-- przykładowy tekst -->
<text x="38" y="36" font-family="Courier New,monospace" font-size="7" fill="#22d3ee" font-weight="700">23.4°C  hPa</text>
<text x="38" y="48" font-family="Courier New,monospace" font-size="7" fill="#22d3ee" font-weight="700">RH:  47%</text>
<text x="38" y="62" font-family="Courier New,monospace" font-size="6" fill="#22d3ee">Lux: 1240</text>
<!-- mini wykres -->
<polyline points="100,72 110,68 120,70 130,64 140,66 150,60 160,62" fill="none" stroke="#4ade80" stroke-width="1.2"/>
<!-- 4 piny I2C -->
<rect x="60" y="108" width="80" height="14" fill="#1a1a1a"/>
<g fill="#c89b2f"><circle cx="72" cy="115" r="2"/><circle cx="90" cy="115" r="2"/><circle cx="108" cy="115" r="2"/><circle cx="126" cy="115" r="2"/></g>
<text x="72" y="130" text-anchor="middle" font-size="6" fill="#cbd5e1">GND</text>
<text x="90" y="130" text-anchor="middle" font-size="6" fill="#cbd5e1">VCC</text>
<text x="108" y="130" text-anchor="middle" font-size="6" fill="#cbd5e1">SCL</text>
<text x="126" y="130" text-anchor="middle" font-size="6" fill="#cbd5e1">SDA</text>
<text x="100" y="98" text-anchor="middle" font-size="7" fill="#94a3b8">OLED 0,96" 128×64 (SSD1306)</text>
