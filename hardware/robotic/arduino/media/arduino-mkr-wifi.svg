<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 90" role="img" aria-label="Arduino MKR WiFi 1010">
<rect x="4" y="8" width="232" height="74" rx="4" fill="#1a1a1a" stroke="#3a3a3a"/>
<!-- USB-C right -->
<rect x="208" y="32" width="32" height="26" rx="3" fill="#9aa4ad" stroke="#5a6670"/>
<rect x="212" y="36" width="24" height="18" rx="2" fill="#1a2026"/>
<text x="224" y="48" text-anchor="middle" font-family="Segoe UI" font-size="6" fill="#7a8590">USB-C</text>
<!-- SAMD21 SMD -->
<rect x="80" y="34" width="36" height="28" rx="1" fill="#0a0a0a"/>
<text x="98" y="48" text-anchor="middle" font-family="Segoe UI" font-size="6" fill="#e2e8f0" font-weight="700">SAMD21</text>
<text x="98" y="58" text-anchor="middle" font-family="Segoe UI" font-size="5" fill="#94a3b8">Cortex-M0+</text>
<!-- NINA WiFi module -->
<rect x="124" y="34" width="60" height="28" rx="1" fill="#0a0a0a"/>
<text x="154" y="48" text-anchor="middle" font-family="Segoe UI" font-size="7" fill="#e2e8f0" font-weight="700">NINA-W102</text>
<text x="154" y="58" text-anchor="middle" font-family="Segoe UI" font-size="5" fill="#fbbf24">WiFi + BLE</text>
<!-- ESP32 antenna trace -->
<path d="M180 34 Q188 24 196 34" fill="none" stroke="#c89b2f" stroke-width="1.5"/>
<!-- Header pins - top & bottom 14 each -->
<rect x="20" y="8" width="180" height="8" fill="#1a1a1a"/>
<g fill="#c89b2f">
<circle cx="28" cy="12" r="1.3"/><circle cx="40" cy="12" r="1.3"/><circle cx="52" cy="12" r="1.3"/><circle cx="64" cy="12" r="1.3"/><circle cx="76" cy="12" r="1.3"/><circle cx="88" cy="12" r="1.3"/><circle cx="100" cy="12" r="1.3"/><circle cx="112" cy="12" r="1.3"/><circle cx="124" cy="12" r="1.3"/><circle cx="136" cy="12" r="1.3"/><circle cx="148" cy="12" r="1.3"/><circle cx="160" cy="12" r="1.3"/><circle cx="172" cy="12" r="1.3"/><circle cx="184" cy="12" r="1.3"/>
</g>
<rect x="20" y="74" width="180" height="8" fill="#1a1a1a"/>
<g fill="#c89b2f">
<circle cx="28" cy="78" r="1.3"/><circle cx="40" cy="78" r="1.3"/><circle cx="52" cy="78" r="1.3"/><circle cx="64" cy="78" r="1.3"/><circle cx="76" cy="78" r="1.3"/><circle cx="88" cy="78" r="1.3"/><circle cx="100" cy="78" r="1.3"/><circle cx="112" cy="78" r="1.3"/><circle cx="124" cy="78" r="1.3"/><circle cx="136" cy="78" r="1.3"/><circle cx="148" cy="78" r="1.3"/><circle cx="160" cy="78" r="1.3"/><circle cx="172" cy="78" r="1.3"/><circle cx="184" cy="78" r="1.3"/>
</g>
<!-- LiPo connector -->
<rect x="0" y="34" width="14" height="22" rx="1" fill="#1a1a1a" stroke="#5a6670"/>
<text x="7" y="48" text-anchor="middle" font-family="Segoe UI" font-size="4" fill="#7a8590">LiPo</text>
<!-- label -->
<text x="22" y="48" font-family="Segoe UI" font-size="8" fill="#ffffff" font-weight="700">MKR</text>
<text x="22" y="60" font-family="Segoe UI" font-size="6" fill="#94a3b8">WiFi 1010</text>
</svg>
