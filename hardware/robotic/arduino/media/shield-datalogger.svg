<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" role="img" aria-label="Data Logger Shield">
<rect x="6" y="14" width="228" height="124" rx="8" fill="#0d3b6f" stroke="#082548"/>
<!-- slot microSD prawy -->
<rect x="180" y="40" width="56" height="44" rx="2" fill="#c0c0c0" stroke="#5a5a5a"/>
<rect x="186" y="46" width="44" height="32" fill="#3a3a3a"/>
<text x="208" y="66" text-anchor="middle" font-size="6" fill="#e2e8f0">microSD</text>
<!-- DS1307 RTC IC -->
<rect x="80" y="50" width="46" height="22" rx="1" fill="#0a0a0a"/>
<text x="103" y="63" text-anchor="middle" font-size="6" fill="#e2e8f0" font-weight="700">DS1307</text>
<!-- bateria CR1220 -->
<circle cx="60" cy="100" r="14" fill="#c0c0c0" stroke="#5a5a5a" stroke-width="1.5"/>
<text x="60" y="98" text-anchor="middle" font-size="5" fill="#0a0a0a" font-weight="700">CR1220</text>
<text x="60" y="106" text-anchor="middle" font-size="4" fill="#0a0a0a">3 V</text>
<!-- quartz 32.768 kHz -->
<rect x="100" y="86" width="18" height="6" rx="1" fill="#c0c0c0"/>
<text x="109" y="100" text-anchor="middle" font-size="4" fill="#94a3b8">32.768 kHz</text>
<!-- header proto -->
<g fill="#c89b2f">
<rect x="140" y="98" width="28" height="14" fill="#1a1a1a"/>
<circle cx="146" cy="105" r="1.4"/><circle cx="154" cy="105" r="1.4"/><circle cx="162" cy="105" r="1.4"/>
</g>
<text x="154" y="124" text-anchor="middle" font-size="5" fill="#cbd5e1">3.3V/5V/GND</text>
<!-- Uno headers -->
<rect x="46" y="14" width="186" height="10" fill="#1a1a1a"/>
<g fill="#c89b2f">
<circle cx="56" cy="19" r="1.3"/><circle cx="66" cy="19" r="1.3"/><circle cx="76" cy="19" r="1.3"/><circle cx="86" cy="19" r="1.3"/><circle cx="96" cy="19" r="1.3"/><circle cx="106" cy="19" r="1.3"/><circle cx="116" cy="19" r="1.3"/><circle cx="126" cy="19" r="1.3"/><circle cx="136" cy="19" r="1.3"/><circle cx="146" cy="19" r="1.3"/><circle cx="156" cy="19" r="1.3"/><circle cx="166" cy="19" r="1.3"/><circle cx="176" cy="19" r="1.3"/><circle cx="186" cy="19" r="1.3"/><circle cx="196" cy="19" r="1.3"/><circle cx="206" cy="19" r="1.3"/><circle cx="216" cy="19" r="1.3"/><circle cx="226" cy="19" r="1.3"/>
</g>
<rect x="20" y="128" width="206" height="10" fill="#1a1a1a"/>
<g fill="#c89b2f"><circle cx="30" cy="133" r="1.3"/><circle cx="40" cy="133" r="1.3"/><circle cx="50" cy="133" r="1.3"/><circle cx="60" cy="133" r="1.3"/><circle cx="70" cy="133" r="1.3"/><circle cx="80" cy="133" r="1.3"/></g>
<text x="160" y="135" font-size="8" fill="#ffffff" font-weight="700">Data Logger</text>
</svg>
