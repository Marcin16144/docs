<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 140" role="img" aria-label="LCD 16x2 z I2C">
<!-- zielony LCD -->
<rect x="10" y="14" width="240" height="80" rx="3" fill="#0a3a1a" stroke="#062a12"/>
<rect x="18" y="22" width="224" height="64" fill="#4ade80" stroke="#2a7a3a" stroke-width="1.5"/>
<!-- 2 wiersze tekstu pikselowego -->
<text x="30" y="46" font-family="Courier New,monospace" font-size="13" fill="#0a3a1a" font-weight="700">Hello, World!</text>
<text x="30" y="72" font-family="Courier New,monospace" font-size="13" fill="#0a3a1a" font-weight="700">Temp: 23.4 C</text>
<!-- modul I2C z tyłu (widoczny po prawej) -->
<rect x="252" y="38" width="6" height="40" fill="#0a0a0a"/>
<!-- 4 piny I2C -->
<rect x="50" y="98" width="80" height="14" fill="#1a1a1a"/>
<g fill="#c89b2f"><circle cx="62" cy="105" r="2"/><circle cx="80" cy="105" r="2"/><circle cx="98" cy="105" r="2"/><circle cx="116" cy="105" r="2"/></g>
<text x="62" y="120" text-anchor="middle" font-size="6" fill="#cbd5e1">GND</text>
<text x="80" y="120" text-anchor="middle" font-size="6" fill="#cbd5e1">VCC</text>
<text x="98" y="120" text-anchor="middle" font-size="6" fill="#cbd5e1">SDA</text>
<text x="116" y="120" text-anchor="middle" font-size="6" fill="#cbd5e1">SCL</text>
<text x="180" y="120" font-size="9" fill="#ffffff" font-weight="700">LCD 16×2 + I²C</text>
<text x="180" y="132" font-size="6" fill="#94a3b8">2 piny zamiast 6</text>
</svg>
