<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" role="img" aria-label="Arduino Leonardo">
<rect x="6" y="14" width="228" height="124" rx="8" fill="#00697a" stroke="#0a4a55"/>
